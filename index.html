<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Translator</title>

    <link rel="stylesheet" href="CSS/modified-bootstrap.css">
    <link rel="stylesheet" href="CSS/font-awesome.css">
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body class="vh-100 w-90 mx-auto d-flex justify-content-center align-items-center">

    <div class="body bg-dark rounded-2 mx-auto p-3 d-flex flex-column align-items-center row-gap-2">
        <h1 class="text-light text-center">Translator App</h1>
        <div class="w-100 d-flex flex-row">
            <div class="w-100 d-flex flex-column align-items-center row-gap-3">
                <textarea class="fromTextArea outline-0 p-2 bg-secondary text-light"></textarea>
                <select class="fromSelect">
                    <option value="en-GB">English</option>
                    <option value="ar-SA">Arabic</option>
                </select>
            </div>

            <div class="w-100 d-flex flex-column align-items-center row-gap-3">
                <textarea disabled class="toTextArea outline-0 p-2 bg-secondary text-light"></textarea>
                <select class="toSelect">
                    <option value="ar-SA">Arabic</option>
                    <option value="en-GB">English</option>
                </select>
            </div>
        </div>
        <i class="fa-solid fa-arrow-right-arrow-left text-light switch"></i>
        <div class="mt-2">
            <button disabled class="btn btn-outline-primary me-3">Translate</button>
            <button disabled class="btn btn-outline-danger">Clear</button>
        </div>
    </div>

    <script src="JS/script.js"></script>
</body>
</html>
